[project]
name = "fpga-simulator"
version = "0.22.0"
description = "Interactive FPGA board simulator with GHDL-backed VHDL simulation"
# Upper bound is still cocotb's, and it moved: cocotb 2.1.0 ships cp314 wheels,
# so 3.14 is in (roadmap P4, closed).  3.15 stays out because cocotb has no
# cp315 wheel yet -- pygame-ce already does.  The bound is load-bearing, not
# decorative: without it uv picks the newest interpreter it can find and
# `uv sync` -- the one command the install docs tell a reader to run -- dies in
# a setuptools traceback.  Found by the install-docs workflow on a runner whose
# default python3 was 3.14; the CI test matrix could not have found it, because
# every job there pins its own python-version.  Re-check PyPI wheel *tags*, not
# release dates, before moving it again.
requires-python = ">=3.10,<3.15"
license = {text = "MIT"}
authors = [
    {name = "Richard Graham", email = "rickhg12hs@users.noreply.github.com"},
    {name = "Benjamin Graham", email = "29547812+benwilliamgraham@users.noreply.github.com"},
    {name = "Oliver Graham", email = "62159522+oliverhgraham@users.noreply.github.com"},
]
keywords = ["fpga", "vhdl", "simulation", "ghdl", "cocotb", "pygame"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "pygame-ce>=2.5.8",
    "cocotb>=2.1",
    "find_libpython",
]

[project.urls]
Repository = "https://github.com/Machai-Kydoimos/fpga-board-sim"
Issues = "https://github.com/Machai-Kydoimos/fpga-board-sim/issues"

[project.scripts]
fpga-sim              = "fpga_sim.__main__:main"
generate-board-images = "fpga_sim.generate_board_images:main"

# uv installs the `dev` group by default; this turns that off, so plain
# `uv sync` -- the one command the README and docs/install.md tell a student to
# run -- installs the three runtime dependencies and nothing else.  The dev
# group is ~30 more packages they never use, and one of them, actionlint-py,
# publishes **no wheels at all**: it builds from an sdist that downloads a
# release binary from GitHub, so a school network or a proxy turns "install the
# simulator" into a build failure with nothing to do with the simulator.
#
# Contributors are unaffected beyond one flag: `uv sync --group dev` once, after
# which `uv run pytest` / `ruff` / `mypy` work unchanged, because `uv run` adds
# what the default groups need but never prunes what is already installed.
# CI already passes --group dev in every ci.yml job.
[tool.uv]
default-groups = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mypy>=2.3.0",
    "ruff>=0.16.3",
    "pre-commit>=4.6.2",
    "jsonschema>=4.0",
    "pytest-randomly>=4.1.0",
    "rumdl>=0.2.55",
    "pillow>=12.3.0",
    # Workflow linter.  Ships as an sdist that downloads the upstream
    # rhysd/actionlint release binary at build time and verifies it against a
    # sha256 baked into the sdist, so the chain is uv.lock -> sdist hash ->
    # pinned binary hash -> official release.  Trade-off: installing needs
    # network (there are no wheels), which CI already has.
    "actionlint-py>=1.7.12.24",
    # Only used by tests/test_workflow_lint_guard.py, to assert on the hook
    # config structurally rather than by string matching.  Already in the tree
    # as a pre-commit dependency, but declared here so the test does not rest
    # on a transitive one that pre-commit could drop.
    "pyyaml>=6.0",
    # TOML reader for the embedded-core generator on Python 3.10; 3.11+ uses stdlib tomllib.
    "tomli>=2.0 ; python_version < '3.11'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "slow: requires GHDL or NVC subprocess (deselect with -m 'not slow')",
    "ui: requires headless pygame display",
]
# Reading or writing text without an explicit encoding uses the locale default,
# which is cp1252 on Windows and UTF-8 everywhere else -- so the same file parses
# differently per platform.  Ruff's PLW1514 catches this statically but only
# where it can prove the receiver is a Path, which misses every `tmp_path / "x"`
# in this suite.  This filter is the inference-independent half: it fires on any
# call actually executed.  It only has teeth when warnings are emitted at all,
# which needs PYTHONWARNDEFAULTENCODING=1 -- set on CI's test matrix, so local
# runs are unaffected.  To reproduce CI:
#   PYTHONWARNDEFAULTENCODING=1 uv run pytest
filterwarnings = ["error::EncodingWarning"]

# ── Ruff (linter + formatter) ────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["amaranth-boards/", "boards/"]

[tool.ruff.lint]
# PLW1514 is still a preview rule, so preview mode has to be on to select it.
# `explicit-preview-rules` keeps that from being a blank cheque: only preview
# rules named in `select` below activate, so turning this on does not silently
# enrol the repo in every other preview rule (6 unrelated ones fire without it).
# Scoped to [lint] rather than [tool.ruff] so the *formatter* stays on stable
# style and this cannot reflow code.
preview = true
explicit-preview-rules = true
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade – modernise syntax
    "N",        # pep8-naming
    "B",        # flake8-bugbear – common bugs
    "ANN",      # missing type annotations
    "D",        # pydocstyle – docstring conventions
    "PLW1514",  # unspecified-encoding – see EncodingWarning note under [tool.pytest]
]
ignore = [
    "D203",     # conflicts with D211 (no-blank-line-before-class)
    "D213",     # conflicts with D212 (multi-line-summary-first-line)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]        # relax annotations + docstrings in tests
"sim/sim_testbench.py" = ["ANN201"] # cocotb async test implicit return type
"sim/test_blinky.py" = ["ANN"]  # cocotb headless tests: dut signals are dynamic
"sim/test_7seg.py" = ["ANN"]   # cocotb headless tests: dut signals are dynamic
"sim/test_cpu_walking.py" = ["ANN"]  # cocotb headless tests: dut signals are dynamic
"sim/test_cpu_hello.py" = ["ANN"]    # cocotb headless tests: dut signals are dynamic
"sim/test_cpu_dice.py" = ["ANN"]     # cocotb headless tests: dut signals are dynamic
"sim/test_cpu_wide_led.py" = ["ANN"] # cocotb headless tests: dut signals are dynamic
"sim/test_stopwatch.py" = ["ANN"]    # cocotb headless tests: dut signals are dynamic
"sim/test_duty.py" = ["ANN"]         # cocotb headless tests: dut signals are dynamic
"sim/test_rgb.py" = ["ANN"]          # cocotb headless tests: dut signals are dynamic
"sim/test_native_scan.py" = ["ANN"]  # cocotb headless tests: dut signals are dynamic
"sim/test_hex_decoder.py" = ["ANN"] # cocotb headless tests: dut signals are dynamic
"sim/test_code_lock.py" = ["ANN"]   # cocotb headless tests: dut signals are dynamic
"sim/test_gates_mux.py" = ["ANN"]   # cocotb headless tests: dut signals are dynamic
"sim/test_countdown.py" = ["ANN"]   # cocotb headless tests: dut signals are dynamic
"sim/test_running_light.py" = ["ANN"] # cocotb headless tests: dut signals are dynamic
# these embed verbatim/near-verbatim real constraint-file excerpts as fixtures;
# line length is a property of the source format, not authored prose.
"tests/test_port_convention_parser_xdc.py" = ["E501"]
"tests/test_port_convention_parser_ucf.py" = ["E501"]
"tests/test_port_convention_parsers_golden.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── mypy (static type checker) ───────────────────────────────────────────────
[tool.mypy]
mypy_path = ["src"]
python_version = "3.10"
ignore_missing_imports = true
exclude = ["amaranth-boards/", "boards/"]
strict = true  # D8 (#125): full strict flip; supersedes the individual flags this used to list

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "test_blinky",
    "test_7seg",
    "test_cpu_walking",
    "test_cpu_hello",
    "test_cpu_dice",
    "test_cpu_wide_led",
    "test_stopwatch",
    "test_duty",
    "test_rgb",
    "test_native_scan",
    "test_hex_decoder",
    "test_code_lock",
    "test_gates_mux",
    "test_countdown",
    "test_running_light",
]
disallow_untyped_defs = false    # test functions and fixtures are exempt
disallow_untyped_calls = false   # ...and so are their calls to each other

# ── rumdl (Markdown linter + formatter) ──────────────────────────────────────
[tool.rumdl]
# MD013 (line length): prose, tables, and long links read fine unwrapped, and
# hard-wrapping Markdown hurts diffs without helping rendering.
# MD036 (emphasis-as-heading): would rewrite bold/italic lead-ins and bylines
# into real headings, changing document structure and the TOC. Left to authors.
disable = ["MD013", "MD036"]
respect-gitignore = true         # skips memory/, .venv/, .pytest_cache/, etc.
exclude = [".git", ".github"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpga_sim"]
