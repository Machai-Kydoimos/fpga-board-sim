repos:
  # Every lint/format/type hook runs as a *local* hook that invokes the
  # uv.lock-pinned tool via `uv run --group dev`, so the version pre-commit uses
  # is always identical to CI's (`uv run ruff/mypy/rumdl ...`) and to the
  # project venv — one source of truth (uv.lock), zero drift.
  #
  # `--group dev` is what makes that true. ruff, mypy, rumdl and actionlint —
  # and the jsonschema that check-registry-schema imports — live in
  # pyproject's `dev` group, and since `[tool.uv] default-groups = []` (#422) a
  # plain `uv run` syncs no group at all: it neither installs a missing tool
  # nor upgrades a stale one. Without the flag, one checkout's hooks were still
  # running ruff 0.16.6 / rumdl 0.2.67 two Dependabot bumps after CI had moved
  # to 0.16.8 / 0.2.73 — at exit 0, printing nothing — and in a fresh checkout
  # (a new clone, or a new worktree, which shares these hooks) they ran
  # whatever copy was on PATH, or failed outright. With it, each hook syncs the
  # dev group first: no measurable cost when nothing changed (18 vs 19 ms), an
  # upgrade when uv.lock moved. tests/test_precommit_hooks.py keeps the flag on
  # every entry.
  #
  # This is a deliberate divergence from Astral's documented recommendation
  # (https://docs.astral.sh/ruff/integrations/), which shows only the
  # `astral-sh/ruff-pre-commit` mirror pinned by a hook `rev:`. That `rev:` is
  # separate from uv.lock and is NOT tracked by Dependabot, so the two silently
  # drift apart on every ruff bump (e.g. uv.lock at 0.15.18 while the rev lagged
  # at 0.15.16). Folding ruff in here — as mypy and rumdl already are — removes
  # that drift class entirely. Trade-off: pre-commit now needs the uv
  # environment, already a hard requirement for this repo (CI + the hooks
  # below); `uv run --group dev` syncs the venv, so first run is self-healing.
  - repo: local
    hooks:
      # ruff lint runs before ruff-format (per Astral's ordering guidance) so
      # `--fix` output is then reformatted. Scoped to python/pyi — this repo has
      # no Jupyter notebooks. pass_filenames stays default (true): only changed
      # files are linted/formatted, unlike the whole-repo mypy hook below.
      - id: ruff
        name: ruff
        entry: uv run --group dev ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format
        entry: uv run --group dev ruff format
        language: system
        types_or: [python, pyi]
      # mypy runs as a local hook (not mirrors-mypy) so it uses the project venv,
      # where pygame / find_libpython / cocotb are importable. The isolated env that
      # mirrors-mypy builds lacks those deps, degrading expressions to Any and
      # tripping warn_return_any — false failures that CI's `uv run mypy .` never
      # sees. Running CI's command (with the dev-group sync CI does as its own
      # step) keeps local and CI in lockstep; the mypy version is pinned by
      # uv.lock rather than a hook rev.
      - id: mypy
        name: mypy
        entry: uv run --group dev mypy .
        language: system
        types: [python]
        pass_filenames: false
      # rumdl runs as a local hook (not the upstream rumdl-pre-commit repo) so it
      # uses the uv.lock-pinned version, keeping local and CI in lockstep — same
      # rationale as the mypy hook above. --fix auto-corrects fixable issues.
      - id: rumdl
        name: rumdl
        entry: uv run --group dev rumdl check --fix
        language: system
        types: [markdown]
      # Text I/O with no explicit encoding decodes via the locale default —
      # cp1252 on Windows — so the same file yields different text per platform,
      # usually as silent mojibake rather than an error. Ruff's PLW1514 (in the
      # `select` list) covers this too, but only where it can prove the receiver
      # is a Path: 11 of the 323 sites the repo actually had. It cannot see
      # `SESSION_FILE = Path.home() / ...`, cannot see an unannotated `tmp_path`
      # fixture, and does not inspect subprocess at all. This hook matches on
      # names instead of inferred types to cover the rest. It is the fast local
      # path only — `tests/test_check_encoding.py::test_repo_is_clean` is what
      # enforces it in CI, since CI runs the lint tools directly, not pre-commit.
      - id: check-encoding
        name: check-encoding
        entry: uv run --group dev python scripts/check_encoding.py
        language: system
        types_or: [python, pyi]
      # The registry TOMLs gained JSON Schemas in #346, but every hook above is
      # scoped to python/pyi/markdown — so a TOML edit ran *no* hook at all and a
      # typo waited for CI. Every registry field is read with .get(), so a
      # misspelled key never raises: `fetchd = true` reads as not-fetched and the
      # row is silently skipped. pass_filenames is false because the script always
      # validates the whole registry (cross-file rules: unique row names, overlay
      # and waves entries naming real rows); `files` only decides *when* to run.
      # Workflow YAML had no gate at all: every hook above is scoped to
      # python/pyi/markdown/toml, and rumdl additionally excludes .github -- so
      # editing ci.yml ran *zero* hooks and any mistake waited for a push.
      # actionlint is Actions-aware where a generic YAML linter is not: it runs
      # shellcheck over `run:` blocks (this workflow does curl + sha256
      # verification, tar extraction, and PATH surgery, where an unquoted
      # variable is a real bug class), validates `uses:` refs, and reports
      # duplicate keys -- which are *valid* YAML that silently keeps the last
      # value, so neither GitHub nor a plain parse would complain.
      #
      # yamllint was measured against this instead and rejected: on the repo's
      # three YAML files it found 0 real defects, ~50 line-length nits at an
      # 80-column default that contradicts this project's 100, and one false
      # positive (`on:` read as boolean, which GitHub requires spelled that
      # way).  Configured down to silence, the only substantive rule it still
      # contributed was key-duplicates -- which actionlint already covers.
      #
      # Local hook via `uv run` rather than upstream's rhysd/actionlint hook,
      # for the same reason as ruff/mypy/rumdl above: a hook `rev:` is not
      # tracked by Dependabot and would drift from uv.lock.  pass_filenames is
      # false because actionlint discovers .github/workflows itself; `files`
      # only decides when to run.
      - id: actionlint
        name: actionlint
        entry: uv run --group dev actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
      - id: check-registry-schema
        name: check-registry-schema
        entry: uv run --group dev python scripts/check_registry_schema.py
        language: system
        files: ^docs/(port_convention_sources|led_color_sources)/.*\.(toml|json)$
        pass_filenames: false
