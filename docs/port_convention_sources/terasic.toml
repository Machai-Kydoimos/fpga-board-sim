[[board]]
name = "DE4"
files = ["custom/de4.json"]
maker = "Terasic"
status = "verified"
notes = "Stratix IV GX (EP4SGX230KF40C2; the board also ships as EP4SGX530, identical pinout). Authored 2026-07-28 from the vendor System CD. | CONFLICT RESOLVED -- the User Manual's Table 2-4 gives BUTTON3 = PIN_AH8, but FIVE independent Terasic projects on the CD (both the DE4_230 and DE4_530 golden tops plus DE4_SDCARD / DE4_USB / DE4_PowerMeasure) all assign PIN_AG8. The board JSON follows the QSFs: they are build-verified artifacts that produced the shipped .sof, while the manual table is prose. Treat Table 2-4's AH8 as a documentation error. | NAME TRAP: the manual's \"Schematic Signal Name\" column gives the clocks as OSC_50_B2..B7, but the actual HDL port names in the golden top are OSC_50_BANK2..BANK7. A board-native design must declare the BANK form; the B form is the schematic net, not a port. | The board has TWO switch banks with OPPOSITE polarity: 4 SLIDE_SW (active high) and an 8-position DIP switch named SW[7:0] (active LOW -- \"when the switch is in the ON position, a logic 0 is selected\"). Both are in the board JSON's switches[] with per-component `inverted`; only SLIDE_SW is declarable as the convention's switches bank. | LED color is not stated anywhere in the manual, so none is registered (verify-or-omit)."

